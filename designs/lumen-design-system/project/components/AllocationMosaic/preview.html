<!-- @dsCard group="Data viz" height=330 subtitle="Area encodes value; a 7% tint and a 20% signal border; the percent carries the colour and a direction glyph" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 20px; background: var(--canvas); color: var(--ink-1); font-family: var(--font-sans); font-size: var(--fs-body); line-height: var(--lh-body); font-variant-numeric: tabular-nums; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
  .head h3 { margin: 0; font-size: var(--fs-row); letter-spacing: var(--tr-snug); }
  .head .cap { display: block; margin-top: 2px; font-size: var(--fs-micro); color: var(--ink-3); }
  .dynamic-treemap-container { position: relative; height: 240px; min-height: 0; max-height: 240px; }
  .treemap-rect-slot { position: absolute; }
  .treemap-tile { inset: 3px; }
</style>
</head>
<body>
  <div class="head">
    <div>
      <h3>Asset allocation</h3>
      <span class="cap">Area is market value · daily change</span>
    </div>
    <div class="treemap-mode-toggles" role="group" aria-label="Mosaic measure">
      <button type="button" class="treemap-mode-pill is-active">Daily</button>
      <button type="button" class="treemap-mode-pill">Total</button>
    </div>
  </div>
  <div class="dynamic-treemap-container">
    <div class="treemap-rect-slot" style="left: 0; top: 0; width: 46%; height: 56%;">
      <div class="treemap-tile gain" role="button" tabindex="0">
        <div class="tile-top-row"><span class="tile-ticker">AAPL</span><span class="tile-active-pip" aria-hidden="true"></span></div>
        <div class="tile-percent">+30.1%</div>
        <div class="tile-subrow"><span class="tile-weight">24.1%</span><span class="tile-value">€4,962.89</span><span class="tile-quantity">27.4 sh</span></div>
      </div>
    </div>
    <div class="treemap-rect-slot" style="left: 46%; top: 0; width: 28%; height: 56%;">
      <div class="treemap-tile gain" role="button" tabindex="0">
        <div class="tile-top-row"><span class="tile-ticker">MSFT</span></div>
        <div class="tile-percent">+13.1%</div>
        <div class="tile-subrow"><span class="tile-weight">19.8%</span><span class="tile-value">€4,086.08</span></div>
      </div>
    </div>
    <div class="treemap-rect-slot" style="left: 74%; top: 0; width: 26%; height: 56%;">
      <div class="treemap-tile gain" role="button" tabindex="0">
        <div class="tile-top-row"><span class="tile-ticker">NVDA</span></div>
        <div class="tile-percent">+37.0%</div>
        <div class="tile-subrow"><span class="tile-weight">17.6%</span><span class="tile-value">€3,617.18</span></div>
      </div>
    </div>
    <div class="treemap-rect-slot" style="left: 0; top: 56%; width: 34%; height: 44%;">
      <div class="treemap-tile gain" role="button" tabindex="0">
        <div class="tile-top-row"><span class="tile-ticker">VOO</span></div>
        <div class="tile-percent">+12.0%</div>
        <div class="tile-subrow"><span class="tile-weight">14.8%</span><span class="tile-value">€3,046.88</span></div>
      </div>
    </div>
    <div class="treemap-rect-slot" style="left: 34%; top: 56%; width: 30%; height: 44%;">
      <div class="treemap-tile loss" role="button" tabindex="0">
        <div class="tile-top-row"><span class="tile-ticker">ASML</span></div>
        <div class="tile-percent">−17.0%</div>
        <div class="tile-subrow"><span class="tile-weight">12.6%</span><span class="tile-value">€2,592.80</span></div>
      </div>
    </div>
    <div class="treemap-rect-slot" style="left: 64%; top: 56%; width: 36%; height: 44%;">
      <div class="treemap-tile loss" role="button" tabindex="0">
        <div class="tile-top-row"><span class="tile-ticker">TSLA</span></div>
        <div class="tile-percent">−12.1%</div>
        <div class="tile-subrow"><span class="tile-weight">11.2%</span><span class="tile-value">€2,304.47</span></div>
      </div>
    </div>
  </div>
</body>
</html>
