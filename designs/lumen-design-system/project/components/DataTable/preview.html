<!-- @dsCard group="Content" height=290 subtitle="Holdings table: micro header, 48px rows, right-aligned tabular numbers, initials fallback tile" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 20px; background: var(--canvas); color: var(--ink-1); font-family: var(--font-sans); font-size: var(--fs-body); line-height: var(--lh-body); font-variant-numeric: tabular-nums; }
  .read-only-status { display: inline-flex; }
</style>
</head>
<body>
  <div class="table-scroll">
    <table class="holdings-table">
      <thead>
        <tr>
          <th scope="col">Asset</th>
          <th scope="col">Qty</th>
          <th scope="col">Avg cost</th>
          <th scope="col">Last</th>
          <th scope="col">Value</th>
          <th scope="col">Unrealised</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>
            <div class="asset-cell">
              <span class="ticker-ring-logo"><span class="ticker-avatar fallback">AP</span></span>
              <span class="asset-text"><strong>Apple Inc.</strong><small>AAPL · USD</small></span>
            </div>
          </td>
          <td>27.4</td>
          <td>$152.30</td>
          <td>$198.17</td>
          <td><strong>€4,962.89</strong><small>24.1% of book</small></td>
          <td class="positive"><strong>+€1,148.75</strong><small>+30.1%</small></td>
        </tr>
        <tr>
          <td>
            <div class="asset-cell">
              <span class="ticker-ring-logo"><span class="ticker-avatar fallback">AS</span></span>
              <span class="asset-text"><strong>ASML Holding N.V.</strong><small>ASML · EUR</small></span>
            </div>
          </td>
          <td>4</td>
          <td>€781.40</td>
          <td>€648.20</td>
          <td><strong>€2,592.80</strong><small>12.6% of book</small></td>
          <td class="negative"><strong>−€532.80</strong><small>−17.0%</small></td>
        </tr>
        <tr>
          <td>
            <div class="asset-cell">
              <span class="ticker-ring-logo"><span class="ticker-avatar fallback">TS</span></span>
              <span class="asset-text"><strong>Tesla Inc.</strong><small>TSLA · USD</small></span>
            </div>
          </td>
          <td>9.5</td>
          <td>$301.80</td>
          <td>$265.40</td>
          <td><strong>€2,304.47</strong><small>11.2% of book</small></td>
          <td class="negative"><strong>−€316.06</strong><small>−12.1%</small></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
